workflows:
  no-red-ios:
    name: NO RED! iOS (starter)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        APP_ID: com.independentstudio.nored
      node: 20
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Generate iOS project if missing
        script: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
      - name: Sync web assets
        script: npx cap sync ios
      - name: Check generated Xcode project
        script: ls -la ios/App
    artifacts:
      - ios/App/**/*.xcworkspace
      - ios/App/**/*.xcodeproj
